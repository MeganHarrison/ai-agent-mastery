name: Frontend ESLint

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use'
        required: false
        default: '22'
        type: string
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  eslint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.13.1

    - name: Set up Node.js ${{ inputs.node-version || '22' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version || '22' }}
        cache: 'pnpm'
        cache-dependency-path: '6_Agent_Deployment/frontend/pnpm-lock.yaml'
        
    - name: Install dependencies
      run: |
        cd 6_Agent_Deployment/frontend
        pnpm install

    - name: Run ESLint
      run: |
        cd 6_Agent_Deployment/frontend
        pnpm run lint
